{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}Student Management System{% endblock %}</title>
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
      <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>

<body>

<div class="sidebar">

    <div class="brand">

        🎓 SMS

    </div>

    <ul>

        <li>
            <a href="{% url 'dashboard' %}" class="active">
                <i class="bi bi-speedometer2"></i>
                Dashboard
            </a>
        </li>

        <li>
            <a href="{% url 'student_list' %}">
                <i class="bi bi-people-fill"></i>
                Students
            </a>
        </li>

        <li>
            <a href="/teachers/"><i class="fa-solid fa-chalkboard-user"></i> Teachers</a>
        </li>

        <li>
            <a href="{% url 'course_list' %}">
    <i class="fa-solid fa-book"></i>
    Courses
</a>
        </li>

        <li>
            <a href="{% url 'attendance_list' %}">
    <i class="fa-solid fa-calendar-check"></i>
    Attendance
</a>
        </li>

        <li>
            <a href="{% url 'fee_list' %}">
    <i class="bi bi-cash-stack"></i>
    Fees
</a>
        </li>

        <li>
         <a href="{% url 'assignment_list' %}">
    <i class="bi bi-file-earmark-text"></i>
    Assignments
</a>
        </li>
        <li>
            <a href="{% url 'exam_list' %}">
    <i class="bi bi-pencil-square"></i>
    Exams
</a>
        </li>
        <li>
            <a href="{% url 'result_list' %}">
    <i class="bi bi-bar-chart-fill"></i>
    Results
</a>
        </li>

    </ul>

</div>

<div class="main">

    <div class="topbar">

        <h4>Student Management System</h4>

        <div>

            <i class="bi bi-person-circle"></i>

            {{ request.user.username }}

        </div>

    </div>

    <div class="content">

        {% block content %}

        {% endblock %}

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
