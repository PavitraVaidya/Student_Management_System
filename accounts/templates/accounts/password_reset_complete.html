{% extends 'base.html' %}

{% block title %}
Password Changed
{% endblock %}

{% block content %}

<style>

    .complete-container {
        max-width: 450px;
        margin: 80px auto;
    }

    .complete-card {
        background: white;
        padding: 40px;
        border-radius: 15px;
        text-align: center;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
    }

    .complete-icon {
        font-size: 55px;
        color: #198754;
        margin-bottom: 20px;
    }

    .complete-card h3 {
        font-weight: 700;
    }

    .complete-card p {
        color: #6c757d;
        margin-top: 15px;
    }

    .login-btn {
        display: inline-block;
        margin-top: 20px;

        padding: 10px 25px;

        background: #0d6efd;
        color: white;

        text-decoration: none;
        border-radius: 8px;
    }

    .login-btn:hover {
        background: #0b5ed7;
        color: white;
    }

</style>


<div class="complete-container">

    <div class="complete-card">

        <div class="complete-icon">
            ✓
        </div>

        <h3>Password Changed Successfully!</h3>

        <p>
            Your password has been reset successfully.
            You can now login using your new password.
        </p>

        <a
            href="{% url 'login' %}"
            class="login-btn"
        >
            Login
        </a>

    </div>

</div>

{% endblock %}
