<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 15px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .login-card h1 {
            text-align: center;
            color: #333;
            font-size: 25px;
            margin-bottom: 10px;
        }

        .login-card h2 {
            text-align: center;
            color: #666;
            font-size: 20px;
            margin-bottom: 30px;
        }

        /* Django generates <p> around form fields */
        form p {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #444;
            font-weight: bold;
        }

        .form-control {
            width: 100%;
            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 8px;

            font-size: 16px;
            outline: none;
        }

        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.4);
        }

        .login-btn {
            width: 100%;
            padding: 12px;

            border: none;
            border-radius: 8px;

            background: #667eea;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .login-btn:hover {
            background: #5563d6;
        }

        .register-text {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .register-text a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }

        .register-text a:hover {
            text-decoration: underline;
        }

        .errorlist {
            color: red;
            list-style: none;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .success-message {
    background-color: #d4edda;
    color: #155724;

    padding: 12px;
    margin-bottom: 20px;

    border: 1px solid #c3e6cb;
    border-radius: 8px;

    text-align: center;
    font-size: 14px;
    font-weight: bold;
}
    </style>

</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <h1>Student Management System</h1>

            <h2>Login</h2>
            {% if messages %}

    {% for message in messages %}

        <div class="success-message">
            {{ message }}
        </div>

    {% endfor %}

{% endif %}

            <form method="POST">

                {% csrf_token %}

                {{ form.as_p }}

                <button
                    type="submit"
                    class="login-btn"
                >
                    Login
                </button>
                <div class="text-center mt-3">
    <a href="{% url 'password_reset' %}">
        Forgot Password?
    </a>
</div>

            </form>

            <p class="register-text">

                Don't have an account?

                <a href="{% url 'register' %}">
                    Create Account
                </a>

            </p>

        </div>

    </div>

</body>

</html>
