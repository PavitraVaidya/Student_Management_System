{% extends 'base.html' %}

{% block title %}
Forgot Password
{% endblock %}

{% block content %}

<style>
    .reset-container {
        max-width: 450px;
        margin: 70px auto;
    }

    .reset-card {
        background: white;
        border-radius: 15px;
        padding: 35px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
    }

    .reset-icon {
        font-size: 45px;
        color: #0d6efd;
        text-align: center;
        margin-bottom: 15px;
    }

    .reset-card h3 {
        text-align: center;
        font-weight: 700;
        margin-bottom: 10px;
    }

    .reset-description {
        text-align: center;
        color: #6c757d;
        margin-bottom: 25px;
    }

    .reset-card label {
        font-weight: 600;
        margin-bottom: 7px;
    }

    .reset-card input {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid #ced4da;
        border-radius: 8px;
        margin-bottom: 20px;
    }

    .reset-card input:focus {
        outline: none;
        border-color: #0d6efd;
        box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.15);
    }

    .reset-btn {
        width: 100%;
        padding: 11px;
        border: none;
        border-radius: 8px;
        background: #0d6efd;
        color: white;
        font-weight: 600;
    }

    .reset-btn:hover {
        background: #0b5ed7;
    }

    .back-login {
        text-align: center;
        margin-top: 20px;
    }

    .back-login a {
        text-decoration: none;
    }

    .errorlist {
        color: #dc3545;
        padding-left: 18px;
    }
</style>


<div class="reset-container">

    <div class="reset-card">

        <div class="reset-icon">
            <i class="bi bi-key-fill"></i>
        </div>

        <h3>Forgot Password?</h3>

        <p class="reset-description">
            Enter your registered email address.
            We'll send you a link to reset your password.
        </p>


        <form method="POST">

            {% csrf_token %}

            {{ form.email.errors }}

            <label for="{{ form.email.id_for_label }}">
                Email Address
            </label>

            {{ form.email }}

            <button
                type="submit"
                class="reset-btn"
            >
                Send Reset Link
            </button>

        </form>


        <div class="back-login">

            <a href="{% url 'login' %}">
                <i class="bi bi-arrow-left"></i>
                Back to Login
            </a>

        </div>

    </div>

</div>

{% endblock %}
