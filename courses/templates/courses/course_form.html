{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}

<div class="container">

<div class="card shadow">

<div class="card-header bg-primary text-white">

<h4>{{ title }}</h4>

</div>

<div class="card-body">

<form method="POST">

{% csrf_token %}

<div class="mb-3">

<label>Course Name</label>

{{ form.course_name }}

</div>

<div class="mb-3">

<label>Course Code</label>

{{ form.course_code }}

</div>

<div class="mb-3">

<label>Duration</label>

{{ form.duration }}

</div>

<div class="mb-3">

<label>Total Semesters</label>

{{ form.total_semesters }}

</div>

<button class="btn btn-success">

Save

</button>

<a href="{% url 'course_list' %}"

class="btn btn-secondary">

Cancel

</a>

</form>

</div>

</div>

</div>

{% endblock %}
