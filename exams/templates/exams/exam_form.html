{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}

<div class="card shadow">

    <div class="card-header bg-primary text-white">

        <h4 class="mb-0">
            {{ title }}
        </h4>

    </div>

    <div class="card-body">

        <form method="POST">

            {% csrf_token %}

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Exam Name
                    </label>

                    {{ form.exam_name }}

                </div>


                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Subject
                    </label>

                    {{ form.subject }}

                </div>


                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Exam Date
                    </label>

                    {{ form.exam_date }}

                </div>


                <div class="col-md-3 mb-3">

                    <label class="form-label">
                        Total Marks
                    </label>

                    {{ form.total_marks }}

                </div>


                <div class="col-md-3 mb-3">

                    <label class="form-label">
                        Passing Marks
                    </label>

                    {{ form.passing_marks }}

                </div>


                <div class="col-md-12 mb-3">

                    <label class="form-label">
                        Description
                    </label>

                    {{ form.description }}

                </div>

            </div>


            <button type="submit" class="btn btn-success">

                <i class="bi bi-check-circle"></i>
                Save Exam

            </button>


            <a
                href="{% url 'exam_list' %}"
                class="btn btn-secondary"
            >

                Cancel

            </a>

        </form>

    </div>

</div>

{% endblock %}
