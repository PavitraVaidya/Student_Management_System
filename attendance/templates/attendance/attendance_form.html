{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}

<div class="container">

<div class="card shadow">

<div class="card-header bg-primary text-white">

<h4>{{ title }}</h4>

</div>

<div class="card-body">

<form method="POST">

{% csrf_token %}

<div class="mb-3">

<label>Student Enrollment</label>

{{ form.student }}

</div>

<div class="mb-3">

<label>Subject</label>

{{ form.subject }}

</div>

<div class="mb-3">

<label>Teacher</label>

{{ form.teacher }}

</div>

<div class="mb-3">

<label>Date</label>

{{ form.date }}

</div>

<div class="mb-3">

<label>Status</label>

{{ form.status }}

</div>

<div class="mb-3">

<label>Remarks</label>

{{ form.remarks }}

</div>

<button class="btn btn-success">

Save

</button>

<a href="{% url 'attendance_list' %}" class="btn btn-secondary">

Cancel

</a>

</form>

</div>

</div>

</div>

{% endblock %}
